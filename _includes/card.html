<article class="card" data-card-name="{{ card.name | escape }}">

  <a
    class="card-image-link"
    data-scryfall-link
    href="https://scryfall.com/search?q=%21{{ card.name | uri_escape }}"
    target="_blank"
    rel="noopener noreferrer"
  >

    <div class="card-image-wrapper">

      <div class="card-loading">
        Loading card...
      </div>

      <img
        class="card-image"
        data-card-image
        alt="{{ card.name | escape }}"
        loading="lazy"
      >

    </div>

  </a>

  <div class="card-info">

    <h2 class="card-name">
      {{ card.name }}
    </h2>

    <span class="card-status">
      BANNED
    </span>

    <a
      class="card-link"
      data-scryfall-link
      href="https://scryfall.com/search?q=%21{{ card.name | uri_escape }}"
      target="_blank"
      rel="noopener noreferrer"
    >
      View on Scryfall →
    </a>

  </div>

</article>
